[pytest]
# Pytest configuration for QView3D

# Test paths
testpaths = tests

# Test file patterns
python_files = test_*.py

# Test class patterns
python_classes = Test*

# Test function patterns
python_functions = test_*

# Coverage options
addopts =
    --verbose
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=0
    -p no:warnings

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require database)
    performance: Performance tests (may be slow)
    security: Security-related tests
    hardware: Tests requiring hardware (printers)

# Ignore paths
norecursedirs = .git .venv __pycache__ node_modules dist build

# Environment variables for testing
env =
    FLASK_ENV=testing
    TESTING=True